# Musical.run Local Server - User Installation
# Single command setup for any machine
#
# Usage: docker-compose -f docker-compose.user.yml up -d
#
# Minimal Autonomous Setup:
# 1. musical-local (local-server)
# 2. postgres (shared: musical_local + gitea databases)
# 3. gitea (git server - mandatory for preview containers)

version: '3.8'

services:
  # Shared PostgreSQL Database
  # Used by both local-server and Gitea
  postgres:
    image: postgres:15-alpine
    container_name: musical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: musical
      POSTGRES_PASSWORD: ${DB_PASSWORD:-musical_secure_pass}
      # No POSTGRES_DB - we create multiple databases via init script
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musical"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musical-local
    labels:
      - "musical.service=postgres"
      - "musical.version=1.0.0"

  # Gitea Git Server (Mandatory)
  # Required for preview containers to pull code from Git
  gitea:
    image: gitea/gitea:latest
    container_name: musical-gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=musical
      - GITEA__database__PASSWD=${DB_PASSWORD:-musical_secure_pass}
      - GITEA__server__ROOT_URL=http://localhost:17101/
      - GITEA__server__HTTP_PORT=3000
    ports:
      - "${GITEA_PORT:-17101}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - musical-local
    labels:
      - "musical.service=gitea"
      - "musical.version=1.0.0"

  # Musical Local Server
  musical-local:
    image: local-server-musical-local-server:latest
    container_name: musical-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gitea:
        condition: service_started
    ports:
      - "${MUSICAL_PORT:-17100}:17100"
    environment:
      # Musical.run cloud connection
      - TUNNEL_ROUTER_URL=https://musical.run
      - AUTH_SERVICE_URL=https://musical.run

      # Database connection (shared PostgreSQL)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=musical_local
      - DB_USER=musical
      - DB_PASSWORD=${DB_PASSWORD:-musical_secure_pass}

      # Gitea connection
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-musical}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-musical_gitea_pass}

      # Auto-setup
      - AUTO_SETUP=${AUTO_SETUP:-true}
      - AUTO_AUTH_ENABLED=false  # Users auth via browser

      # Optional: Pre-configure Anthropic API key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    volumes:
      # User data persistence
      - musical_data:/root/.musical

      # Docker socket for creating project containers
      - /var/run/docker.sock:/var/run/docker.sock

    labels:
      - "musical.service=local-server"
      - "musical.version=1.0.0"

    networks:
      - musical-local

networks:
  musical-local:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  gitea_data:
    driver: local
  musical_data:
    driver: local
