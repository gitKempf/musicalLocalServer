# Musical.run Local Server - Instance-Based Docker Compose
# 
# This file uses environment variables for instance isolation.
# Each installation gets a unique INSTANCE_ID to prevent conflicts.
#
# Usage:
#   INSTANCE_ID=home docker-compose -f docker-compose.instance.yml up -d
#
# Or with .env file containing INSTANCE_ID=home

services:
  # PostgreSQL Database - Instance-specific
  postgres:
    image: postgres:15-alpine
    container_name: musical-postgres-${INSTANCE_ID:-default}
    hostname: postgres-${INSTANCE_ID:-default}
    restart: unless-stopped
    environment:
      POSTGRES_USER: musical
      POSTGRES_PASSWORD: ${DB_PASSWORD:-musical_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musical"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      musical-network:
        aliases:
          - postgres
          - postgres-${INSTANCE_ID:-default}
    labels:
      - "musical.service=postgres"
      - "musical.instance=${INSTANCE_ID:-default}"

  # Gitea Git Server - Instance-specific
  gitea:
    image: gitea/gitea:latest
    container_name: musical-gitea-${INSTANCE_ID:-default}
    hostname: gitea-${INSTANCE_ID:-default}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=musical
      - GITEA__database__PASSWD=${DB_PASSWORD:-musical_secure_pass}
      - GITEA__server__ROOT_URL=http://localhost:${GITEA_PORT:-17101}/
      - GITEA__server__HTTP_PORT=3000
    ports:
      - "${GITEA_PORT:-17101}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      musical-network:
        aliases:
          - gitea
          - gitea-${INSTANCE_ID:-default}
    labels:
      - "musical.service=gitea"
      - "musical.instance=${INSTANCE_ID:-default}"

  # Claude Agent - Instance-specific
  claude-agent:
    build:
      context: ./claude-agent
      dockerfile: Dockerfile
    container_name: musical-claude-agent-${INSTANCE_ID:-default}
    hostname: claude-agent-${INSTANCE_ID:-default}
    restart: unless-stopped
    environment:
      - PORT=17110
      - LOG_LEVEL=info
    volumes:
      # Mount user's Claude credentials (read-only for security)
      - ${CLAUDE_CONFIG_PATH:-~/.config/claude-code}:/root/.config/claude-code:ro
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      musical-network:
        aliases:
          - claude-agent
          - claude-agent-${INSTANCE_ID:-default}
    labels:
      - "musical.service=claude-agent"
      - "musical.instance=${INSTANCE_ID:-default}"

  # Musical Local Server - Instance-specific
  musical-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musical-local-${INSTANCE_ID:-default}
    hostname: musical-local-${INSTANCE_ID:-default}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gitea:
        condition: service_started
    ports:
      - "${MUSICAL_PORT:-17100}:17100"
    environment:
      # Instance identification
      - INSTANCE_ID=${INSTANCE_ID:-default}
      
      # Musical.run cloud connection
      - TUNNEL_ROUTER_URL=https://musical.run
      - AUTH_SERVICE_URL=https://musical.run

      # Database connection - use internal hostname
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=musical_local
      - DB_USER=musical
      - DB_PASSWORD=${DB_PASSWORD:-musical_secure_pass}

      # Gitea connection - use internal hostname
      - GITEA_URL=http://gitea:3000
      - GITEA_CONTAINER=musical-gitea-${INSTANCE_ID:-default}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-musical}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-musical_gitea_pass}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - GITEA_USERNAME=${GITEA_USERNAME:-musical}

      # Claude Agent - use internal hostname
      - CLAUDE_AGENT_URL=http://claude-agent:17110

      # Docker network for project containers
      - DOCKER_NETWORK=musical-network-${INSTANCE_ID:-default}

      # Auto-setup
      - AUTO_SETUP=${AUTO_SETUP:-true}
      - AUTO_AUTH_ENABLED=false

      # Optional: Pre-configure Anthropic API key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    volumes:
      # Instance-specific data persistence
      - musical_data:/root/.musical
      # Docker socket for creating project containers
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      musical-network:
        aliases:
          - musical-local
          - musical-local-${INSTANCE_ID:-default}
    labels:
      - "musical.service=local-server"
      - "musical.instance=${INSTANCE_ID:-default}"

# Instance-specific network
networks:
  musical-network:
    name: musical-network-${INSTANCE_ID:-default}
    driver: bridge
    labels:
      - "musical.instance=${INSTANCE_ID:-default}"

# Instance-specific volumes (names set via docker compose --project-name)
volumes:
  postgres_data:
    name: musical-postgres-data-${INSTANCE_ID:-default}
  gitea_data:
    name: musical-gitea-data-${INSTANCE_ID:-default}
  musical_data:
    name: musical-data-${INSTANCE_ID:-default}
